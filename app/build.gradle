plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.animatedkeyboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.oklabs.keyaura"
        minSdk 24
        targetSdk 34
        versionCode 14
        versionName "1.1.12"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Petal Ads (Huawei Ads Kit). ads-prime = works on HMS AND non-HMS (Google Play) devices.
    // ads-lite would only serve ads on devices that have HMS Core.
    implementation 'com.huawei.hms:ads-prime:3.4.91.301'
}
