name: Build and Release Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Fix gradlew and build
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m"
          
      - name: Sign APK with jarsigner
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore keyaura.keystore -storepass 12345678 -keypass 12345678 app/build/outputs/apk/debug/app-debug.apk keyaura
          
      - name: Verify Signature
        run: jarsigner -verify app/build/outputs/apk/debug/app-debug.apk
        
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: v${{ github.run_number }}
          name: KeyAura3 v${{ github.run_number }}
          body: Auto-built signed APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
