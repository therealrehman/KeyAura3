name: Build and Release Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > keyaura.jks

      - name: Build Unsigned Release APK
        env:
          JAVA_TOOL_OPTIONS: -Xmx2048m
        run: gradle :app:assembleRelease --no-daemon

      - name: Zipalign APK
        run: |
          ${ANDROID_HOME}/build-tools/34.0.0/zipalign -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/KeyAura-aligned.apk

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner sign \
            --ks keyaura.jks \
            --ks-pass pass:"$STORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out app/build/outputs/apk/release/KeyAura-signed.apk \
            app/build/outputs/apk/release/KeyAura-aligned.apk

      - name: Verify Signature
        run: |
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner verify \
            app/build/outputs/apk/release/KeyAura-signed.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/KeyAura-signed.apk
          tag_name: v${{ github.run_number }}
          name: KeyAura v${{ github.run_number }}
          body: "Signed Release APK - KeyAura"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
