name: Build and Release Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Keystore
        run: echo "" | base64 -d > keyaura.jks

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Xms512m"

      - name: Sign APK
        run: |
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore keyaura.jks \
            -storepass Keyaura123 \
            -keypass Keyaura123 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            Keyaura

      - name: Zipalign APK
        run: |
          ${ANDROID_HOME}/build-tools/34.0.0/zipalign -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/KeyAura-signed.apk

      - name: Verify Signature
        run: jarsigner -verify app/build/outputs/apk/release/KeyAura-signed.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/KeyAura-signed.apk
          tag_name: v${{ github.run_number }}
          name: KeyAura v${{ github.run_number }}
          body: "Signed Release APK - KeyAura"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
